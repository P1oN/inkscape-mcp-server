[package]
name = "inkscape-mcp-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"

# Development-only tools. These dependencies are never shipped in ready packages.
[features]
default = ["native"]
native = ["dep:toml", "dep:regex", "dep:libc", "dep:base64", "dep:png", "dep:inkscape-mcp-rust", "dep:libxml"]

[[bin]]
name = "inkscape-mcp-tools"
path = "src/main.rs"
required-features = ["native"]

[[bin]]
name = "inkscape-mcp-release-guard"
path = "src/release_guard/main.rs"

[dependencies]
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip", "arbitrary_precision"] }
sha2 = "=0.10.9"
toml = { version = "=1.1.6", optional = true }
regex = { version = "=1.13.1", optional = true }
tempfile = "=3.27.0"
tar = "=0.4.46"
flate2 = "=1.1.10"
libc = { version = "=0.2.190", optional = true }
base64 = { version = "=0.23.1", optional = true }
png = { version = "=0.18.1", optional = true }
inkscape-mcp-rust = { path = "..", optional = true }
libxml = { version = "=0.3.21", optional = true }

[profile.dev]
opt-level = 1
debug = 0
incremental = false
