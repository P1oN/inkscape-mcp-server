<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660"><rect id="background" x="0" y="0" width="1440" height="660" rx="0" style="fill:#f4f1ea"/><text id="eyebrow" x="64" y="58" style="fill:#57706a;font-family:Arial;font-size:15;font-weight:bold">START WITH THE MANAGER</text><text id="title" x="64" y="120" style="fill:#142c2b;font-family:Arial;font-size:42;font-weight:bold">Your first drawing is four steps away.</text><text id="intro" x="64" y="162" style="fill:#57706a;font-family:Arial;font-size:22;font-weight:normal">Apple Silicon macOS 15+ / Inkscape 1.4+ / an MCP client</text><g xmlns:ns0="http://www.inkscape.org/namespaces/inkscape" id="download" ns0:label="Download"><rect id="download-card" x="64" y="218" width="304" height="282" rx="18" style="fill:#fffef9"/><circle id="download-circle" cx="110" cy="269" r="22" style="fill:#e86d4a;stroke:none;stroke-width:1"/><text id="download-number" x="98" y="276" style="fill:#fffef9;font-family:Arial;font-size:18;font-weight:bold">01</text><text id="download-title" x="88" y="350" style="fill:#142c2b;font-family:Arial;font-size:30;font-weight:bold">Download</text><text id="download-line1" x="88" y="401" style="fill:#57706a;font-family:Arial;font-size:19;font-weight:normal">Get the Manager DMG</text><text id="download-line2" x="88" y="432" style="fill:#57706a;font-family:Arial;font-size:19;font-weight:normal">from GitHub Releases.</text></g><g xmlns:ns0="http://www.inkscape.org/namespaces/inkscape" id="workspace" ns0:label="Choose"><rect id="workspace-card" x="400" y="218" width="304" height="282" rx="18" style="fill:#fffef9"/><circle id="workspace-circle" cx="446" cy="269" r="22" style="fill:#196d67;stroke:none;stroke-width:1"/><text id="workspace-number" x="434" y="276" style="fill:#fffef9;font-family:Arial;font-size:18;font-weight:bold">02</text><text id="workspace-title" x="424" y="350" style="fill:#142c2b;font-family:Arial;font-size:30;font-weight:bold">Choose</text><text id="workspace-line1" x="424" y="401" style="fill:#57706a;font-family:Arial;font-size:19;font-weight:normal">Select your MCP clients</text><text id="workspace-line2" x="424" y="432" style="fill:#57706a;font-family:Arial;font-size:19;font-weight:normal">and an SVG workspace.</text></g><g xmlns:ns0="http://www.inkscape.org/namespaces/inkscape" id="install" ns0:label="Install"><rect id="install-card" x="736" y="218" width="304" height="282" rx="18" style="fill:#fffef9"/><circle id="install-circle" cx="782" cy="269" r="22" style="fill:#196d67;stroke:none;stroke-width:1"/><text id="install-number" x="770" y="276" style="fill:#fffef9;font-family:Arial;font-size:18;font-weight:bold">03</text><text id="install-title" x="760" y="350" style="fill:#142c2b;font-family:Arial;font-size:30;font-weight:bold">Install</text><text id="install-line1" x="760" y="401" style="fill:#57706a;font-family:Arial;font-size:19;font-weight:normal">Review the changes,</text><text id="install-line2" x="760" y="432" style="fill:#57706a;font-family:Arial;font-size:19;font-weight:normal">then install the runtime.</text></g><g xmlns:ns0="http://www.inkscape.org/namespaces/inkscape" id="reconnect" ns0:label="Reconnect"><rect id="reconnect-card" x="1072" y="218" width="304" height="282" rx="18" style="fill:#fffef9"/><circle id="reconnect-circle" cx="1118" cy="269" r="22" style="fill:#196d67;stroke:none;stroke-width:1"/><text id="reconnect-number" x="1106" y="276" style="fill:#fffef9;font-family:Arial;font-size:18;font-weight:bold">04</text><text id="reconnect-title" x="1096" y="350" style="fill:#142c2b;font-family:Arial;font-size:30;font-weight:bold">Reconnect</text><text id="reconnect-line1" x="1096" y="401" style="fill:#57706a;font-family:Arial;font-size:19;font-weight:normal">Restart your client.</text><text id="reconnect-line2" x="1096" y="432" style="fill:#57706a;font-family:Arial;font-size:19;font-weight:normal">Ask it to draw.</text></g><g xmlns:ns0="http://www.inkscape.org/namespaces/inkscape" id="note" ns0:label="Installation note"><rect id="note-bg" x="64" y="539" width="1312" height="65" rx="12" style="fill:#d8e9b8"/><text id="note-text" x="88" y="580" style="fill:#142c2b;font-family:Arial;font-size:23;font-weight:normal">The Manager bundles an offline runtime. Ordinary installation needs no Terminal.</text></g></svg>