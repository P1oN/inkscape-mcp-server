<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600"><rect id="background" x="0" y="0" width="1440" height="600" rx="0" style="fill:#f4f1ea"/><text id="eyebrow" x="64" y="58" style="fill:#57706a;font-family:Arial;font-size:15;font-weight:bold">HOW IT WORKS</text><text id="title" x="64" y="120" style="fill:#142c2b;font-family:Arial;font-size:42;font-weight:bold">A clear path from intent to SVG.</text><text id="intro" x="64" y="162" style="fill:#57706a;font-family:Arial;font-size:22;font-weight:normal">Your agent makes bounded edits. Inkscape brings the vectors to life.</text><g xmlns:ns0="http://www.inkscape.org/namespaces/inkscape" id="agent" ns0:label="Your agent"><rect id="agent-card" x="64" y="222" width="400" height="218" rx="18" style="fill:#fffef9"/><circle id="agent-dot" cx="106" cy="266" r="14" style="fill:#e86d4a;stroke:none;stroke-width:1"/><text id="agent-number" x="390" y="272" style="fill:#57706a;font-family:Arial;font-size:18;font-weight:bold">01</text><text id="agent-title" x="92" y="337" style="fill:#142c2b;font-family:Arial;font-size:32;font-weight:bold">Your agent</text><text id="agent-sub" x="92" y="381" style="fill:#57706a;font-family:Arial;font-size:18;font-weight:normal">Codex / Claude / MCP client</text></g><g xmlns:ns0="http://www.inkscape.org/namespaces/inkscape" id="server" ns0:label="Inkscape MCP"><rect id="server-card" x="520" y="222" width="400" height="218" rx="18" style="fill:#142c2b"/><circle id="server-dot" cx="562" cy="266" r="14" style="fill:#d8e9b8;stroke:none;stroke-width:1"/><text id="server-number" x="846" y="272" style="fill:#bed0c6;font-family:Arial;font-size:18;font-weight:bold">02</text><text id="server-title" x="548" y="337" style="fill:#fffef9;font-family:Arial;font-size:32;font-weight:bold">Inkscape MCP</text><text id="server-sub" x="548" y="381" style="fill:#bed0c6;font-family:Arial;font-size:18;font-weight:normal">Typed tools / Rust / local STDIO</text></g><g xmlns:ns0="http://www.inkscape.org/namespaces/inkscape" id="engine" ns0:label="Inkscape"><rect id="engine-card" x="976" y="222" width="400" height="218" rx="18" style="fill:#fffef9"/><circle id="engine-dot" cx="1018" cy="266" r="14" style="fill:#196d67;stroke:none;stroke-width:1"/><text id="engine-number" x="1302" y="272" style="fill:#57706a;font-family:Arial;font-size:18;font-weight:bold">03</text><text id="engine-title" x="1004" y="337" style="fill:#142c2b;font-family:Arial;font-size:32;font-weight:bold">Inkscape</text><text id="engine-sub" x="1004" y="381" style="fill:#57706a;font-family:Arial;font-size:18;font-weight:normal">Render / inspect / export</text></g><g xmlns:ns0="http://www.inkscape.org/namespaces/inkscape" id="connections" ns0:label="Local request and rendering flow"><g id="arrow-1" ns0:label="Flow arrow 1"><path id="arrow-1-shaft" d="M 472 322 L 495 322" style="fill:none;stroke:#57706a;stroke-width:2"/><path id="arrow-1-head" d="M 486 313 L 495 322 L 486 331" style="fill:none;stroke:#57706a;stroke-width:2"/></g><g id="arrow-2" ns0:label="Flow arrow 2"><path id="arrow-2-shaft" d="M 928 322 L 951 322" style="fill:none;stroke:#57706a;stroke-width:2"/><path id="arrow-2-head" d="M 942 313 L 951 322 L 942 331" style="fill:none;stroke:#57706a;stroke-width:2"/></g></g><g xmlns:ns0="http://www.inkscape.org/namespaces/inkscape" id="contract" ns0:label="Working-copy contract"><rect id="contract-card" x="64" y="478" width="1312" height="68" rx="12" style="fill:#d8e9b8"/><text id="contract-text" x="92" y="520" style="fill:#142c2b;font-family:Arial;font-size:23;font-weight:normal">Working copies + snapshots + operation records. Your source file stays untouched.</text></g></svg>