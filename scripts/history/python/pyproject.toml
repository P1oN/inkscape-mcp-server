[project]
name = "inkscape-mcp-runtime-tools"
version = "0.1.0"
description = "Private live helper and development tools for the Rust Inkscape MCP server"
requires-python = ">=3.12"
dependencies = ["lxml==6.1.1", "numpy==2.5.3", "cssselect==1.5.0", "tinycss2==1.5.1", "webencodings==0.6.1", "pillow==12.2.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
extend-exclude = ["runtime/helper_extension", "migration", ".inkscape-mcp-local", "rust/target", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"runtime/tests/**" = ["S101", "S105", "S106", "S107", "S108"]

[tool.pytest.ini_options]
testpaths = ["runtime/tests"]
