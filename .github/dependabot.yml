version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /rust
      - /rust/tooling
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-patches:
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
