name: Rust checks and native packages

# Automatic Apple Silicon builds; other POSIX targets are available by manual dispatch.
# Windows is intentionally pending the native reparse/rename-handle port.
"on":
  workflow_dispatch:
    inputs:
      targets:
        description: Platforms to build
        type: choice
        default: macos-arm64
        options:
          - macos-arm64
          - all-posix
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "migration/**"
      - "scripts/**"
      - "skills/**"
      - "setup.sh"
      - "run-mcp.sh"
      - "runtime/**"
      - ".github/workflows/rust-migration.yml"
  pull_request:
    paths:
      - "rust/**"
      - "migration/**"
      - "scripts/**"
      - "skills/**"
      - "setup.sh"
      - "run-mcp.sh"
      - "runtime/**"
      - ".github/workflows/rust-migration.yml"

permissions:
  contents: read

jobs:
  native-posix:
    name: Native candidate (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.targets == 'all-posix' && '[{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","package":"linux-x86_64"},{"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","package":"linux-arm64"},{"runner":"macos-15-intel","target":"x86_64-apple-darwin","package":"macos-x86_64"},{"runner":"macos-15","target":"aarch64-apple-darwin","package":"macos-arm64"}]' || '[{"runner":"macos-15","target":"aarch64-apple-darwin","package":"macos-arm64"}]') }}
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_TERM_COLOR: always
      SENTRY_DSN: ""
      SENTRY_TRACES_SAMPLE_RATE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux XML build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-dev pkg-config clang libclang-dev python3
      - name: Locate macOS SDK XML library
        if: runner.os == 'macOS'
        run: echo "LIBXML2=$(xcrun --show-sdk-path)/usr/lib/libxml2.tbd" >> "$GITHUB_ENV"
      - name: Install pinned Rust tooling
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Verify actual native target
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          rustc --version --verbose > rust-build-environment.txt
          python3 -c 'import os, pathlib; actual = pathlib.Path("rust-build-environment.txt").read_text(); assert "host: " + os.environ["EXPECTED_TARGET"] + "\n" in actual, actual'
      - name: Format
        run: cargo fmt --check --manifest-path rust/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --all-targets --manifest-path rust/Cargo.toml -- -D warnings
      - name: Install pinned packaging Python manager
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: false
      - name: Install private helper build runtime and pinned dependencies
        run: |
          uv python install 3.12.14
          uv venv --managed-python --python 3.12.14 .venv
          uv pip install --python .venv/bin/python --only-binary :all: -r rust/package/helper-requirements.txt
      - name: Native tests
        run: cargo test --locked --manifest-path rust/Cargo.toml
      - name: Build release executable
        run: cargo build --locked --release --manifest-path rust/Cargo.toml
      - name: Real STDIO discovery contract
        run: |
          .venv/bin/python scripts/migration_probe.py --output migration/results/ci-discovery --matrix --discovery-only -- rust/target/release/inkscape-mcp-rust
          .venv/bin/python scripts/migration_compare.py migration/contracts migration/results/ci-discovery --report migration/results/ci-discovery-comparison.json
      - name: Record executable hash and dynamic dependencies
        shell: bash
        run: |
          python3 -c 'import hashlib, pathlib; p = pathlib.Path("rust/target/release/inkscape-mcp-rust"); print(hashlib.sha256(p.read_bytes()).hexdigest(), p)' >> rust-build-environment.txt
          if [ "$RUNNER_OS" = "macOS" ]; then
            otool -L rust/target/release/inkscape-mcp-rust >> rust-build-environment.txt
          else
            ldd rust/target/release/inkscape-mcp-rust >> rust-build-environment.txt
          fi
      - name: Install native packaging dependencies and Inkscape (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends patchelf dbus-bin libglib2.0-bin software-properties-common
          sudo add-apt-repository -y ppa:inkscape.dev/stable
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends inkscape
          inkscape --version
      - name: Install native packaging dependencies and Inkscape (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install glib dbus
          brew install --cask inkscape
      - name: Retained live helper regressions
        run: |
          uv pip install --python .venv/bin/python 'pytest>=8.0'
          .venv/bin/python -m pytest runtime/tests
      - name: Synthetic package dependency resolver regressions
        run: .venv/bin/python scripts/migration_posix_builder_acceptance.py --output migration/results/ci-builder --report migration/results/ci-builder.json
      - name: Bootstrap input and cleanup guards
        if: matrix.target == 'aarch64-apple-darwin'
        run: .venv/bin/python scripts/bootstrap_acceptance.py --output migration/results/ci-bootstrap-guards
      - name: Build native installable archive
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          .venv/bin/python scripts/migration_build_posix_package.py --output "dist/inkscape-mcp-$PACKAGE" --archive "dist/inkscape-mcp-$PACKAGE.tar.gz"
          .venv/bin/python scripts/migration_notices_acceptance.py --package "dist/inkscape-mcp-$PACKAGE" --report migration/results/ci-notices.json
      - name: Rust STDIO security and resource invariants
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          .venv/bin/python scripts/rust_security_acceptance.py --binary "dist/inkscape-mcp-$PACKAGE/bin/inkscape-mcp" --output migration/results/ci-security
          .venv/bin/python scripts/rust_stdio_startup_acceptance.py --binary "dist/inkscape-mcp-$PACKAGE/bin/inkscape-mcp" --output migration/results/ci-startup
          .venv/bin/python scripts/rust_responsiveness_acceptance.py --binary "dist/inkscape-mcp-$PACKAGE/bin/inkscape-mcp" --output migration/results/ci-responsiveness
          .venv/bin/python scripts/rust_defects_acceptance.py --binary "dist/inkscape-mcp-$PACKAGE/bin/inkscape-mcp" --output migration/results/ci-defects
          .venv/bin/python scripts/rust_diagnostic_limits_acceptance.py --binary "dist/inkscape-mcp-$PACKAGE/bin/inkscape-mcp" --output migration/results/ci-diagnostic-limits
          .venv/bin/python scripts/rust_stdio_frame_acceptance.py --binary "dist/inkscape-mcp-$PACKAGE/bin/inkscape-mcp" --output migration/results/ci-stdio-frame
          .venv/bin/python scripts/rust_compare_publication_acceptance.py --binary "dist/inkscape-mcp-$PACKAGE/bin/inkscape-mcp" --output migration/results/ci-compare-publication
          .venv/bin/python scripts/migration_special_file_acceptance.py --binary "dist/inkscape-mcp-$PACKAGE/bin/inkscape-mcp" --output migration/results/ci-special-files
          .venv/bin/python scripts/rust_renderer_asset_probe.py --binary "dist/inkscape-mcp-$PACKAGE/bin/inkscape-mcp" --output migration/results/ci-renderer-assets --require-isolation
          .venv/bin/python scripts/rust_engine_routes_acceptance.py --binary "dist/inkscape-mcp-$PACKAGE/bin/inkscape-mcp" --output migration/results/ci-engine-routes
      - name: Source checkout setup without manual environment configuration
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/inkscape-mcp-source-workspace"
          if [ "$RUNNER_OS" = macOS ] && [ "$(uname -m)" = arm64 ]; then
            ./setup.sh --workspace "$RUNNER_TEMP/inkscape-mcp-source-workspace"
          else
            ./setup.sh --local-tools --workspace "$RUNNER_TEMP/inkscape-mcp-source-workspace"
          fi
      - name: Private Sentry setup and hidden input acceptance
        run: .venv/bin/python scripts/launcher_sentry_acceptance.py --output migration/results/ci-sentry-setup
      - name: Empty-PATH launcher/configuration acceptance
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          .venv/bin/python scripts/migration_launcher_acceptance.py --package "dist/inkscape-mcp-$PACKAGE" --output migration/results/ci-launcher
      - name: Install actual archive with empty PATH and real CLI acceptance
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          .venv/bin/python scripts/migration_package_acceptance.py --archive "dist/inkscape-mcp-$PACKAGE.tar.gz" --output migration/results/ci-package-cold --report migration/results/ci-package-cold.json
          .venv/bin/python scripts/migration_package_acceptance.py --archive "dist/inkscape-mcp-$PACKAGE.tar.gz" --engine-mode shell --output migration/results/ci-package-shell --report migration/results/ci-package-shell.json
          .venv/bin/python scripts/migration_doctor_acceptance.py --package "dist/inkscape-mcp-$PACKAGE" --output migration/results/ci-doctor --report migration/results/ci-doctor.json
      - name: Compute archive checksum
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          .venv/bin/python - <<'PY'
          import hashlib, os
          from pathlib import Path
          archive = Path("dist") / ("inkscape-mcp-" + os.environ["PACKAGE"] + ".tar.gz")
          checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          Path(str(archive) + ".sha256").write_text(checksum + "  " + archive.name + "\n")
          PY
      - name: Upload verified installable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inkscape-mcp-${{ matrix.package }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Retain build and acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-evidence-${{ matrix.target }}
          path: |
            dist/*/LICENSE-INVENTORY.json
            dist/*/FILES.json
            dist/*/libexec/inkscape-mcp/package.json
            rust/Cargo.lock
            rust-build-environment.txt
            migration/results/ci-discovery/
            migration/results/ci-discovery-comparison.json
            migration/results/ci-package-*/
            migration/results/ci-package-*.json
            migration/results/ci-doctor/
            migration/results/ci-doctor.json
            migration/results/ci-notices.json
            migration/results/ci-launcher/
            migration/results/ci-sentry-setup/
            migration/results/ci-bootstrap-guards/
            migration/results/ci-defects/
            migration/results/ci-responsiveness/
            migration/results/ci-startup/
          if-no-files-found: error
          retention-days: 14
