name: Rust checks and native packages

# Automatic Apple Silicon builds; other POSIX targets are available by manual dispatch.
# Windows is intentionally pending the native reparse/rename-handle port.
"on":
  workflow_dispatch:
    inputs:
      targets:
        description: Platforms to build
        type: choice
        default: macos-arm64
        options:
          - macos-arm64
          - all-posix
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quick-checks:
    name: Quick Rust checks
    runs-on: macos-15
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_TERM_COLOR: always
      SENTRY_DSN: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Locate macOS SDK XML library
        run: echo "LIBXML2=$(xcrun --show-sdk-path)/usr/lib/libxml2.tbd" >> "$GITHUB_ENV"
      - name: Install pinned Rust tooling
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Bash syntax
        run: |
          for script in setup.sh run-mcp.sh uninstall.sh scripts/*.sh; do bash -n "$script"; done
      - name: Release publication guard tests
        run: scripts/test-publish-verified-release.sh
      - name: Development cleanup guard tests
        run: scripts/test-development-cleanup.sh
      - name: Format and Clippy (both Cargo graphs)
        run: |
          cargo fmt --check --manifest-path rust/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path rust/Cargo.toml -- -D warnings
          cargo fmt --check --manifest-path rust/tooling/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path rust/tooling/Cargo.toml -- -D warnings
      - name: Development tooling tests
        run: cargo test --locked --manifest-path rust/tooling/Cargo.toml

  native-posix:
    needs: quick-checks
    name: Native candidate (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.targets == 'all-posix' && '[{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","package":"linux-x86_64"},{"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","package":"linux-arm64"},{"runner":"macos-15-intel","target":"x86_64-apple-darwin","package":"macos-x86_64"},{"runner":"macos-15","target":"aarch64-apple-darwin","package":"macos-arm64"}]' || '[{"runner":"macos-15","target":"aarch64-apple-darwin","package":"macos-arm64"}]') }}
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_TERM_COLOR: always
      SENTRY_DSN: ""
      SENTRY_TRACES_SAMPLE_RATE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux XML build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-dev pkg-config clang libclang-dev
      - name: Locate macOS SDK XML library
        if: runner.os == 'macOS'
        run: echo "LIBXML2=$(xcrun --show-sdk-path)/usr/lib/libxml2.tbd" >> "$GITHUB_ENV"
      - name: Install pinned Rust tooling
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Verify actual native target
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          rustc --version --verbose > rust-build-environment.txt
          test "$(sed -n 's/^host: //p' rust-build-environment.txt)" = "$EXPECTED_TARGET"
      - name: Native tests
        run: cargo test --locked --manifest-path rust/Cargo.toml
      - name: Build release executable
        run: cargo build --locked --release --manifest-path rust/Cargo.toml
      - name: Real STDIO discovery contract
        run: |
          scripts/dev-tools.sh discovery --binary rust/target/release/inkscape-mcp-rust --output migration/results/ci-discovery --matrix
      - name: Record executable hash and dynamic dependencies
        shell: bash
        run: |
          shasum -a 256 rust/target/release/inkscape-mcp-rust >> rust-build-environment.txt
          if [ "$RUNNER_OS" = "macOS" ]; then
            otool -L rust/target/release/inkscape-mcp-rust >> rust-build-environment.txt
          else
            ldd rust/target/release/inkscape-mcp-rust >> rust-build-environment.txt
          fi
      - name: Install native packaging dependencies and Inkscape (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends patchelf dbus-bin libglib2.0-bin software-properties-common
          sudo add-apt-repository -y ppa:inkscape.dev/stable
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends inkscape
          inkscape --version
      - name: Install native packaging dependencies and Inkscape (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install glib dbus
          brew install --cask inkscape
      - name: Build native installable archive
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          scripts/dev-tools.sh build-package --output "dist/inkscape-mcp-$PACKAGE" --archive "dist/inkscape-mcp-$PACKAGE.tar.gz"
          scripts/dev-tools.sh notices-acceptance --package "dist/inkscape-mcp-$PACKAGE" --output migration/results/ci-notices
      - name: Build distinct native baseline for runtime-update acceptance
        if: matrix.package == 'macos-arm64'
        run: |
          baseline_source=$(mktemp -d "$RUNNER_TEMP/update-baseline.XXXXXX")
          git archive HEAD | tar -x -C "$baseline_source"
          printf 'inkscape-mcp-source-v1\n%s\n' "$(git rev-parse HEAD)" > "$baseline_source/SOURCE_REVISION"
          # Same implementation, distinct honest compiled identity; never publish this fixture.
          printf '\n// Independent-update acceptance baseline fixture.\n' >> "$baseline_source/rust/src/lib.rs"
          cargo build --locked --release --manifest-path "$baseline_source/rust/Cargo.toml" --target-dir "$GITHUB_WORKSPACE/rust/target"
          scripts/dev-tools.sh build-package --binary rust/target/release/inkscape-mcp-rust --output dist/update-baseline
          cargo build --locked --release --manifest-path rust/Cargo.toml
      - name: Permanent launcher and deterministic downloaded-update acceptance
        if: matrix.package == 'macos-arm64'
        run: |
          scripts/dev-tools.sh update-acceptance --package dist/inkscape-mcp-macos-arm64 --previous-package dist/update-baseline --runtime-archive dist/inkscape-mcp-macos-arm64.tar.gz --output migration/results/ci-updates
      - name: Rust STDIO security and resource invariants
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          scripts/dev-tools.sh security-acceptance --binary "dist/inkscape-mcp-$PACKAGE/bin/inkscape-mcp" --output migration/results/ci-security
          scripts/dev-tools.sh startup-acceptance --binary "dist/inkscape-mcp-$PACKAGE/bin/inkscape-mcp" --output migration/results/ci-startup
          scripts/dev-tools.sh responsiveness-acceptance --binary "dist/inkscape-mcp-$PACKAGE/bin/inkscape-mcp" --output migration/results/ci-responsiveness
          scripts/dev-tools.sh defects-acceptance --binary "dist/inkscape-mcp-$PACKAGE/bin/inkscape-mcp" --output migration/results/ci-defects
          scripts/dev-tools.sh diagnostic-acceptance --binary "dist/inkscape-mcp-$PACKAGE/bin/inkscape-mcp" --output migration/results/ci-diagnostic-limits
          scripts/dev-tools.sh frame-acceptance --binary "dist/inkscape-mcp-$PACKAGE/bin/inkscape-mcp" --output migration/results/ci-stdio-frame
          scripts/dev-tools.sh compare-acceptance --binary "dist/inkscape-mcp-$PACKAGE/bin/inkscape-mcp" --output migration/results/ci-compare-publication
          scripts/dev-tools.sh special-file-acceptance --binary "dist/inkscape-mcp-$PACKAGE/bin/inkscape-mcp" --output migration/results/ci-special-files
          scripts/dev-tools.sh renderer-acceptance --binary "dist/inkscape-mcp-$PACKAGE/bin/inkscape-mcp" --output migration/results/ci-renderer-assets
          scripts/dev-tools.sh engine-routes-acceptance --binary "dist/inkscape-mcp-$PACKAGE/bin/inkscape-mcp" --output migration/results/ci-engine-routes
      - name: Source checkout setup without manual environment configuration
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/inkscape-mcp-source-workspace"
          if [ "$RUNNER_OS" = macOS ] && [ "$(uname -m)" = arm64 ]; then
            ./setup.sh --workspace "$RUNNER_TEMP/inkscape-mcp-source-workspace"
          else
            ./setup.sh --local-tools --workspace "$RUNNER_TEMP/inkscape-mcp-source-workspace"
          fi
      - name: Private Sentry setup and hidden input acceptance
        run: scripts/dev-tools.sh sentry-setup-acceptance --output migration/results/ci-sentry-setup
      - name: Empty-PATH launcher/configuration acceptance
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          scripts/dev-tools.sh launcher-acceptance --package "dist/inkscape-mcp-$PACKAGE" --output migration/results/ci-launcher
      - name: Install actual archive with empty PATH and real CLI acceptance
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          scripts/dev-tools.sh package-acceptance --archive "dist/inkscape-mcp-$PACKAGE.tar.gz" --output migration/results/ci-package-cold
          scripts/dev-tools.sh package-acceptance --archive "dist/inkscape-mcp-$PACKAGE.tar.gz" --engine-mode shell --output migration/results/ci-package-shell
          scripts/dev-tools.sh socket-acceptance --binary "dist/inkscape-mcp-$PACKAGE/bin/inkscape-mcp-live" --output migration/results/ci-socket
          scripts/dev-tools.sh doctor-acceptance --package "dist/inkscape-mcp-$PACKAGE" --output migration/results/ci-doctor
      - name: Compute archive checksum
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          (cd dist && shasum -a 256 "inkscape-mcp-$PACKAGE.tar.gz" > "inkscape-mcp-$PACKAGE.tar.gz.sha256")
      - name: Export committed source archive
        if: matrix.package == 'macos-arm64'
        run: |
          scripts/dev-tools.sh source-archive --output dist/inkscape-mcp-source-bootstrap.tar.gz
          (cd dist && shasum -a 256 inkscape-mcp-source-bootstrap.tar.gz > inkscape-mcp-source-bootstrap.tar.gz.sha256)
      - name: Produce independent instruction and launcher assets
        if: matrix.package == 'macos-arm64'
        run: |
          scripts/dev-tools.sh build-instructions --output dist/inkscape-mcp-instructions --version "$GITHUB_SHA" --archive dist/inkscape-mcp-instructions.tar.gz
          mkdir -p dist/inkscape-mcp-launcher/bin
          cp dist/inkscape-mcp-macos-arm64/bin/inkscape-mcp-launcher dist/inkscape-mcp-launcher/bin/
          cp -R "dist/inkscape-mcp-macos-arm64/management/Inkscape MCP Manager.app" dist/inkscape-mcp-launcher/
          tar -czf dist/inkscape-mcp-launcher.tar.gz -C dist inkscape-mcp-launcher
          scripts/dev-tools.sh build-update-manifest --output dist/inkscape-mcp-update-template.json --tag "$GITHUB_SHA" --runtime dist/inkscape-mcp-macos-arm64.tar.gz --instructions dist/inkscape-mcp-instructions.tar.gz --launcher dist/inkscape-mcp-launcher.tar.gz
          (cd dist && shasum -a 256 inkscape-mcp-instructions.tar.gz > inkscape-mcp-instructions.tar.gz.sha256)
          (cd dist && shasum -a 256 inkscape-mcp-launcher.tar.gz > inkscape-mcp-launcher.tar.gz.sha256)
      - name: Upload verified installable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inkscape-mcp-${{ matrix.package }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*-template.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Retain build and acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-evidence-${{ matrix.target }}
          path: |
            dist/*/LICENSE-INVENTORY.json
            dist/*/FILES.json
            dist/*/libexec/inkscape-mcp/package.json
            rust/Cargo.lock
            rust/tooling/Cargo.lock
            migration/results/ci-socket/
            rust-build-environment.txt
            migration/results/ci-discovery/
            migration/results/ci-updates/
            migration/results/ci-package-*/
            migration/results/ci-doctor/
            migration/results/ci-notices/
            migration/results/ci-launcher/
            migration/results/ci-sentry-setup/
            migration/results/ci-defects/
            migration/results/ci-responsiveness/
            migration/results/ci-startup/
          if-no-files-found: error
          retention-days: 14
