  <rect width="720" height="480" fill="url(#white-bottom)"/>
  <text x="360" y="96" text-anchor="middle" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#252830">Inkscape MCP Manager</text>
  <path id="drag-arrow" d="M355 233 L369 247 L355 261" fill="none" stroke="#555a63" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
